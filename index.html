<script>

const KEY='sportroad.v1';

const icon=n=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';
const EX={gravitron:{name:'Гравитрон',n:3,min:8,max:12,help:true},pulldown:{name:'Тяга верхнего блока к груди',n:2,min:10,max:12},row:{name:'Тяга нижнего блока к животу',n:2,min:10,max:12},chest:{name:'Жим от груди в тренажёре',n:3,min:10,max:12},fly:{name:'Сведение рук на грудь',n:2,min:12,max:12},shoulder:{name:'Жим плечами в тренажёре',n:2,min:10,max:12},legpress:{name:'Жим ногами',n:2,min:10,max:12},curl:{name:'Сгибание ног в тренажёре',n:2,min:12,max:12},abduction:{name:'Разведение ног в тренажёре',n:2,min:15,max:15},abs:{name:'Пресс в тренажёре',n:2,min:12,max:15},hyper:{name:'Гиперэкстензия',n:2,min:12,max:12}};
const PROGRAMS={A:{name:'Спина и подтягивания',short:'Спина',subtitle:'Тяги · контроль · сила',ex:['gravitron','pulldown','row']},B:{name:'Грудь и плечи',short:'Грудь и плечи',subtitle:'Жимы · грудь · плечи',ex:['chest','fly','shoulder']},C:{name:'Ноги и ягодицы',short:'Ноги и ягодицы',subtitle:'Ноги · устойчивость · ягодицы',ex:['legpress','curl','abduction']}};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);
function localDay(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayLabel(day,full=false){return new Date(day+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:full?'long':'short',...(full?{year:'numeric'}:{})})}
const today=()=>localDay();
const uid=()=>globalThis.crypto?.randomUUID?.()||'s'+Date.now().toString(36)+Math.random().toString(36).slice(2);
function fresh(){return {version:1,sessions:[],active:null,settings:{rest:90},lastExport:null}}
let persisted=null,blocked=false,store=fresh(),tab='programs',period='30',exerciseChoice='gravitron',metricChoice='weight',confirmAction=null,toastTimeout;
const validDay=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())&&localDay(new Date(s+'T12:00:00'))===s;
const finite=(n,min,max)=>typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max;
function validate(data){
 if(!data||data.version!==1||!Array.isArray(data.sessions)||data.sessions.length>50000)throw Error('Неизвестный формат файла.');
 const settings=data.settings;
 if(!settings||![90,120].includes(settings.rest))throw Error('Некорректные настройки.');
 const ids=new Set();
 function session(s,active){
  if(!s||typeof s.id!=='string'||s.id.length>100||!s.id||ids.has(s.id)||!Object.hasOwn(PROGRAMS,s.program)||!validDay(s.date)||!finite(s.startedAt,0,1e14)||(!active&&!finite(s.finishedAt,s.startedAt,1e14)))throw Error('Некорректная запись тренировки.');
  ids.add(s.id);
  for(const k of ['bodyWeight','pullups'])if(s[k]!==null&&!finite(s[k],k==='bodyWeight'?1:0,k==='bodyWeight'?500:100))throw Error('Некорректный вес или повторения.');
  if(s.pullups!==null&&!Number.isInteger(s.pullups))throw Error('Некорректные подтягивания.');
  if(!Array.isArray(s.exercises)||s.exercises.length<1||s.exercises.length>20)throw Error('Некорректные упражнения.');
  const exerciseIds=new Set();
  const exercises=s.exercises.map(e=>{
   if(!e||!Object.hasOwn(EX,e.id)||exerciseIds.has(e.id)||typeof e.skipped!=='boolean'||!Array.isArray(e.sets)||e.sets.length!==EX[e.id].n)throw Error('Некорректные подходы.');
   exerciseIds.add(e.id);
   return {id:e.id,skipped:e.skipped,sets:e.sets.map(x=>{
    if(!x||typeof x.done!=='boolean'||(x.weight!==null&&!finite(x.weight,0,2000))||(x.reps!==null&&(!finite(x.reps,1,200)||!Number.isInteger(x.reps)))||(x.done&&(x.weight===null||x.reps===null)))throw Error('Некорректные значения подхода.');
    return {weight:x.weight,reps:x.reps,done:x.done};
   })};
  });
  for(const k of ['before','after','warmup'])if(typeof s[k]!=='boolean')throw Error('Некорректная отметка.');
  let running;
  if(s.running!==undefined){
   if(!s.running||typeof s.running!=='object')throw Error('Некорректные данные бега.');
   running={};for(const part of ['before','after']){const v=s.running[part];if(!v||(v.speed!==null&&!finite(v.speed,0.1,40))||(v.minutes!==null&&!finite(v.minutes,0.1,600)))throw Error('Некорректные данные бега.');running[part]={speed:v.speed,minutes:v.minutes};}
  }
  const result={id:s.id,program:s.program,date:s.date,startedAt:s.startedAt,finishedAt:active?null:s.finishedAt,bodyWeight:s.bodyWeight,pullups:s.pullups,before:s.before,after:s.after,warmup:s.warmup,restUntil:active&&finite(s.restUntil,0,1e14)?s.restUntil:null,exercises};
  if(running)result.running=running;
  return result;
 }
 const sessions=data.sessions.map(s=>session(s,false)),active=data.active?session(data.active,true):null;
 // Remove only the old automatic pause in a draft; completed history stays intact.

}
function storageError(message){$('#storage-error').hidden=false;$('#storage-error').textContent=message}
try{persisted=localStorage.getItem(KEY);if(persisted)store=validate(JSON.parse(persisted));}catch(e){blocked=true;storageError('Не удалось прочитать дневник. Запись приостановлена. Открой настройки и сохрани экспорт перед восстановлением.');}
function save(){
 if(blocked){toast('Запись приостановлена. Проверь настройки данных.');return false}
 try{
  const latest=localStorage.getItem(KEY);
  if(latest!==persisted){store=latest?validate(JSON.parse(latest)):fresh();persisted=latest;render();toast('Данные изменены в другой вкладке. Повтори действие.');return false}
  const encoded=JSON.stringify(store);localStorage.setItem(KEY,encoded);persisted=encoded;$('#storage-error').hidden=true;return true;
 }catch(e){storageError('Не удалось сохранить изменения в браузере. Не закрывай страницу: сделай экспорт в настройках.');return false}
}
function toast(message){clearTimeout(toastTimeout);$('#toast').textContent=message;$('#toast').classList.add('visible');toastTimeout=setTimeout(()=>$('#toast').classList.remove('visible'),3500)}
function ask(title,copy,label,action){$('#confirm-title').textContent=title;$('#confirm-copy').textContent=copy;$('#confirm-ok').textContent=label;confirmAction=action;$('#confirm').showModal()}
function doneSets(s){return s.exercises.flatMap(e=>e.skipped?[]:e.sets.filter(x=>x.done))}
function lastSession(){return [...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finishedAt-a.finishedAt)[0]}
function nextProgram(){const last=lastSession();return last?({A:'B',B:'C',C:'A'}[last.program]):'A'}
function rangeText(e){return e.min===e.max?e.min:e.min+'–'+e.max}
function previousSets(id){const sessions=[...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finishedAt-a.finishedAt);for(const s of sessions){const e=s.exercises.find(e=>e.id===id&&!e.skipped&&e.sets.some(x=>x.done));if(e)return e.sets.filter(x=>x.done)}return []}
function render(){

 const labels={programs:store.active?'Тренировка':'Программы',analytics:'Аналитика'};
 document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');b.innerHTML=icon(b.dataset.tab==='programs'&&store.active?'workout':b.dataset.tab)+labels[b.dataset.tab]+(b.dataset.tab==='programs'&&store.active?'<i class="live-dot" aria-label="Есть текущая тренировка"></i>':'')});

 const s=store.sessions.find(s=>s.id===id);if(!s)return;
 $('#record-title').textContent='Тренировка '+s.program;$('#record').dataset.id=id;
 $('#record-body').innerHTML=`<p class="muted" style="margin-bottom:16px">${dayLabel(s.date,true)} · ${doneSets(s).length} подходов</p><div class="two-fields"><label class="field">Дата<input type="date" id="record-date" value="${s.date}" max="${today()}"></label><label class="field">Мой вес, кг<input type="text" inputmode="decimal" id="record-weight" value="${s.bodyWeight??''}" placeholder="—"></label></div><label class="field" style="margin:14px 0">Подтягивания без помощи<input type="text" inputmode="numeric" id="record-pullups" value="${s.pullups??''}" placeholder="—"></label>${['before','after'].map(part=>{const v=s.running?.[part]||{speed:null,minutes:null};return `<div class="record-exercise"><h3>${part==='before'?'Бег до тренировки':'Бег после тренировки'}</h3><div class="two-fields"><label class="field">Скорость, км/ч<input type="text" inputmode="decimal" data-record-run="${part}" data-record-run-field="speed" value="${v.speed??''}"></label><label class="field">Время, мин<input type="text" inputmode="decimal" data-record-run="${part}" data-record-run-field="minutes" value="${v.minutes??''}"></label></div></div>`}).join('')}${s.exercises.map(e=>`<div class="record-exercise"><h3>${EX[e.id].name}</h3>${e.skipped?'<p>Пропущено</p>':'<div class="sets-head"><span>№</span><span>'+(EX[e.id].help?'Помощь, кг':'Вес, кг')+'</span><span>Повторы</span><span>Готово</span></div>'+e.sets.map((x,i)=>`<div class="set-row"><span class="set-number">${i+1}</span><input type="text" inputmode="decimal" data-record-ex="${e.id}" data-i="${i}" data-kind="weight" value="${x.weight??''}" aria-label="${EX[e.id].name}, подход ${i+1}, ${EX[e.id].help?'помощь':'вес'}" placeholder="кг"><input type="text" inputmode="numeric" data-record-ex="${e.id}" data-i="${i}" data-kind="reps" value="${x.reps??''}" aria-label="${EX[e.id].name}, подход ${i+1}, повторы" placeholder="повт."><input type="checkbox" data-record-done="${e.id}" data-i="${i}" ${x.done?'checked':''} aria-label="${EX[e.id].name}, подход ${i+1} выполнен"></div>`).join('')}</div>`).join('')}<p class="inline-error" id="record-error" role="alert"></p><div class="dialog-actions"><button class="quiet danger" id="delete-record">Удалить</button><button class="primary" id="save-record">Сохранить</button></div>`;$('#record').showModal();
}
function saveRecord(){
 const id=$('#record').dataset.id,original=store.sessions.find(s=>s.id===id);if(!original)return;
 const s=JSON.parse(JSON.stringify(original)),error=$('#record-error');
 const date=$('#record-date').value,bw=numericValue($('#record-weight').value,'bodyWeight'),pu=numericValue($('#record-pullups').value,'pullups');
 if(!validDay(date)||date>today()||bw===undefined||pu===undefined){error.textContent='Проверь дату, вес и подтягивания.';return}
 s.date=date;s.bodyWeight=bw;s.pullups=pu;
 if(!s.running)s.running=emptyRunning();
 for(const part of ['before','after'])for(const field of ['speed','minutes']){const v=numericValue($(`[data-record-run="${part}"][data-record-run-field="${field}"]`).value,field==='speed'?'runSpeed':'runMinutes');if(v===undefined){error.textContent='Проверь скорость и время бега.';return}s.running[part][field]=v;}

 for(const e of s.exercises){if(e.skipped)continue;for(let i=0;i<e.sets.length;i++){
  const w=numericValue($(`[data-record-ex="${e.id}"][data-i="${i}"][data-kind="weight"]`).value,'weight'),r=numericValue($(`[data-record-ex="${e.id}"][data-i="${i}"][data-kind="reps"]`).value,'reps'),done=$(`[data-record-done="${e.id}"][data-i="${i}"]`).checked;
  if(w===undefined||r===undefined||(done&&(w===null||r===null))){error.textContent='У выполненных подходов должны быть вес и повторы. Вес без отягощения — 0.';return}e.sets[i]={weight:w,reps:r,done};
 }}
 store.sessions[store.sessions.findIndex(x=>x.id===id)]=s;if(save()){$('#record').close();render();toast('Запись исправлена.');}
}
function updateTimer(){const s=store.active,el=$('#timer-time');if(!s||!el)return;const remaining=s.restUntil?Math.max(0,Math.ceil((s.restUntil-Date.now())/1000)):store.settings.rest;el.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');$('#timer-toggle').textContent=s.restUntil?(remaining?'Стоп':'Ещё раз'):'Старт'}
function settings(){ $('#rest-setting').value=store.settings.rest;$('#backup-info').textContent=store.lastExport?'Последний экспорт: '+new Date(store.lastExport).toLocaleString('ru-RU'):'Резервной копии пока нет.';$('#storage-status').textContent=blocked?'Запись приостановлена':$('#storage-error').hidden?'Сохранено в этом браузере':'Есть несохранённые изменения';$('#settings').showModal()}
function download(text,name){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportData(){if(blocked){download(persisted??'{}','SportRoad-recovery.json');toast('Исходные данные выгружены для восстановления.');return}store.lastExport=Date.now();save();download(JSON.stringify(store,null,2),'SportRoad-'+today()+'.json');$('#backup-info').textContent='Экспорт подготовлен: '+new Date().toLocaleString('ru-RU');toast('Файл экспорта подготовлен.');}
async function importFile(file){
 if(!file)return;if(file.size>25*1024*1024){toast('Файл слишком большой: максимум 25 МБ.');return}
 try{
  const imported=validate(JSON.parse(await file.text()));
  if(blocked){ask('Восстановить дневник?',`В файле ${imported.sessions.length} тренировок. Нечитаемые данные будут заменены этим файлом. Сначала сохрани их через экспорт.`,'Восстановить',()=>{try{localStorage.setItem(KEY,JSON.stringify(imported));persisted=localStorage.getItem(KEY);store=imported;blocked=false;$('#storage-error').hidden=true;$('#settings').close();render();toast('Дневник восстановлен.');}catch(e){toast('Браузер не разрешил сохранить данные.')}});return}
  const existing=new Map(store.sessions.map(s=>[s.id,s])),duplicates=imported.sessions.filter(s=>existing.has(s.id)).length;
  ask('Импортировать историю?',`${imported.sessions.length} тренировок в файле. Новые записи добавятся, ${duplicates} совпадающих обновятся из файла. Повторный импорт не создаст дубликаты. Текущая тренировка на этом устройстве сохранится.`,'Импортировать',()=>{
   // Completed records take precedence over a draft of the same workout.
   for(const s of imported.sessions)existing.set(s.id,s);
   store.sessions=[...existing.values()];
   if(store.active&&existing.has(store.active.id))store.active=null;
   if(!store.active&&imported.active&&!existing.has(imported.active.id))store.active=imported.active;
   if(save()){$('#settings').close();render();toast('История импортирована.');}
  });
 }catch(e){toast('Импорт отклонён: '+(e instanceof SyntaxError?'это не JSON-файл.':e.message))}
}
$('#app').addEventListener('input',event=>{
 const el=event.target,s=store.active;if(!s)return;
 if(el.dataset.run){const key=el.dataset.runField,value=numericValue(el.value,key==='speed'?'runSpeed':'runMinutes');el.setAttribute('aria-invalid',String(value===undefined));if(value===undefined)return;if(!s.running)s.running=emptyRunning();s.running[el.dataset.run][key]=value;save();return}
 if(el.dataset.field||el.dataset.session){const field=el.dataset.field||el.dataset.session,value=numericValue(el.value,field);el.setAttribute('aria-invalid',String(value===undefined));if(value===undefined)return;
 if(el.dataset.field){const set=s.exercises.find(e=>e.id===el.dataset.ex).sets[Number(el.dataset.set)];set[field]=value;if(value===null&&set.done){set.done=false;const row=el.closest('.set-row');row.classList.remove('done');const button=row.querySelector('.set-check');button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Отметить подход '+(Number(el.dataset.set)+1)+': '+EX[el.dataset.ex].name);refreshProgress()}}
 else s[field]=value;save();
 }
});
$('#app').addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='exercise-select'){exerciseChoice=el.value;render();return}if(el.id==='metric-select'){metricChoice=el.value;render();return}
 if(!store.active)return;
 if(el.dataset.check){store.active[el.dataset.check]=el.checked;document.querySelectorAll('[data-check="'+el.dataset.check+'"]').forEach(input=>input.checked=el.checked);save()}
});
$('#app').addEventListener('click',event=>{
 const b=event.target.closest('button,[data-point]');if(!b)return;
 if(b.dataset.point){const card=b.closest('.chart-card');card.querySelector('.chart-tip').textContent=b.dataset.point;return}
 if(b.dataset.start)return start(b.dataset.start);
 if(b.dataset.go)return switchTab(b.dataset.go);
 if(b.dataset.period){period=b.dataset.period;render();return}
 if(b.dataset.record)return openRecord(b.dataset.record);
 if(!store.active)return;
 if(b.dataset.adjust){const input=$(`[data-ex="${b.dataset.ex}"][data-set="${b.dataset.set}"][data-field="weight"]`),value=numericValue(input.value,'weight');if(value===undefined){input.setAttribute('aria-invalid','true');input.focus();return}const next=Math.max(0,Math.min(2000,Math.round(((value??0)+Number(b.dataset.adjust)*2.5)*100)/100));input.value=String(next);input.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(b.dataset.done)return markDone(b.dataset.done,Number(b.dataset.set));
 if(b.dataset.skip){if(hasInvalid())return;const e=store.active.exercises.find(e=>e.id===b.dataset.skip);const toggle=()=>{e.skipped=!e.skipped;if(save())render()};if(!e.skipped&&e.sets.some(x=>x.done))ask('Пропустить упражнение?','Отмеченные подходы останутся в черновике, но не попадут в статистику. Можно вернуть упражнение.','Пропустить',toggle);else toggle();return}
 if(b.dataset.action==='finish')return finish();
 if(b.dataset.action==='timer'){const s=store.active;s.restUntil=s.restUntil&&s.restUntil>Date.now()?null:Date.now()+store.settings.rest*1000;if(save())updateTimer()}
 if(b.dataset.action==='timer-add'){store.active.restUntil=Math.max(Date.now(),store.active.restUntil||Date.now()+store.settings.rest*1000)+30000;if(save())updateTimer()}
});
$('#app').addEventListener('keydown',event=>{if(event.target.dataset.point&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(hasInvalid())return;switchTab(b.dataset.tab)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
$('#confirm-ok').onclick=()=>{const action=confirmAction;confirmAction=null;$('#confirm').close();if(action)action()};
$('#settings-open').onclick=settings;$('#export-data').onclick=exportData;$('#import-data').onclick=()=>$('#import-file').click();$('#import-file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
$('#rest-setting').onchange=e=>{store.settings.rest=Number(e.target.value);save()};
$('#reset-data').onclick=()=>ask('Удалить весь дневник?','Все тренировки и текущий прогресс будут удалены из этого браузера. Сначала сделай экспорт, если хочешь сохранить копию.','Удалить всё',()=>{try{localStorage.removeItem(KEY);persisted=null;store=fresh();blocked=false;$('#storage-error').hidden=true;$('#settings').close();switchTab('programs');toast('Дневник очищен.')}catch(e){toast('Не удалось удалить данные.')}});
$('#record').addEventListener('click',event=>{if(event.target.id==='save-record')saveRecord();if(event.target.id==='delete-record'){const id=$('#record').dataset.id;ask('Удалить эту тренировку?','Она исчезнет из истории и графиков. Другие тренировки этого дня сохранятся.','Удалить',()=>{store.sessions=store.sessions.filter(s=>s.id!==id);if(save()){$('#record').close();render();toast('Тренировка удалена.')}})}});
// Place the caret at the end on entry while allowing a later tap to reposition it.
const firstTextTap=new WeakSet();
function textInput(el){return el instanceof HTMLInputElement&&el.type==='text'}
function caretToEnd(el){if(document.activeElement===el&&el.value.length)el.setSelectionRange(el.value.length,el.value.length)}
document.addEventListener('pointerdown',event=>{const el=event.target;if(textInput(el)&&document.activeElement!==el)firstTextTap.add(el)});
document.addEventListener('focusin',event=>{const el=event.target;if(textInput(el))requestAnimationFrame(()=>caretToEnd(el))});
document.addEventListener('click',event=>{const el=event.target;if(textInput(el)&&firstTextTap.has(el)){firstTextTap.delete(el);caretToEnd(el)}});
window.addEventListener('storage',event=>{if(event.key!==KEY&&event.key!==null)return;try{const raw=localStorage.getItem(KEY);store=raw?validate(JSON.parse(raw)):fresh();persisted=raw;blocked=false;document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();toast('История обновлена из другой вкладки.')}catch(e){blocked=true;storageError('В другой вкладке появились нечитаемые данные. Сделай экспорт и восстанови дневник.')}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(tab==='analytics'&&!document.querySelector('dialog[open]'))render()},150)});
let knownDay=today();function checkDay(){if(knownDay!==today()){knownDay=today();if(!store.active&&!document.querySelector('dialog[open]'))render()}}
setInterval(()=>{updateTimer();checkDay()},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateTimer();checkDay()}});
render();
</script>
</body>
</html>
