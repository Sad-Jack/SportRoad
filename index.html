<nav class="nav" aria-label="Разделы"><button data-tab="programs" class="active"></button><button data-tab="analytics"></button></nav><button class="icon-button" id="settings-open" aria-label="Настройки и данные" title="Настройки и данные"></button>
</header>

</div>
<dialog id="settings"><div class="dialog-heading"><h2>Настройки</h2><button class="icon-button" data-close="settings" aria-label="Закрыть настройки">×</button></div><div class="settings-body">
<div><span class="storage-status" id="storage-status">Сохранено в этом браузере</span></div>

</div></dialog>
<dialog id="plan-editor" tabindex="-1"><div class="dialog-heading"><h2>Настроить программу</h2><button class="icon-button" data-close="plan-editor" aria-label="Закрыть редактор">×</button></div><div id="plan-editor-body"></div></dialog>
<dialog id="confirm"><div class="dialog-heading"><h2 id="confirm-title"></h2><button class="icon-button" data-close="confirm" aria-label="Закрыть">×</button></div><p id="confirm-copy" class="dialog-copy"></p><div class="dialog-actions"><button data-close="confirm" class="quiet">Отмена</button><button id="confirm-ok" class="primary">Подтвердить</button></div></dialog>
<dialog id="record"><div class="dialog-heading"><h2 id="record-title"></h2><button class="icon-button" data-close="record" aria-label="Закрыть историю">×</button></div><div id="record-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const DEMO=typeof location!=='undefined'&&new URLSearchParams(location.search).get('demo')==='1';
const KEY=DEMO?'sportroad.demo.v1':'sportroad.v1';
const ICONS={grip:'<circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/>',chevron:'<path d="m7 10 5 5 5-5"/>',right:'<path d="m9 6 6 6-6 6"/>',back:'<path d="m14 6-6 6 6 6"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',dumbbell:'<path d="M4 9v6m4-9v12m8-12v12m4-9v6M8 12h8"/>',programs:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',workout:'<path d="m9 5 11 7-11 7z"/>',analytics:'<path d="M4 4v16h17M8 15l4-5 4 2 5-7"/>',settings:'<path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',moon:'<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/>',finish:'<path d="M5 21V4m0 1c5-3 9 3 14 0v9c-5 3-9-3-14 0"/>' ,check:'<path d="m5 12 4 4 10-10"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',walk:'<circle cx="14" cy="4" r="2"/><path d="m7 10 4-3 4 3 4 1M11 7l-1 7 5 3 1 5M10 14l-5 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const icon=n=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';
const EX={gravitron:{name:'Гравитрон',n:3,min:8,max:12,help:true},pulldown:{name:'Тяга верхнего блока к груди',n:2,min:10,max:12},row:{name:'Тяга нижнего блока к животу',n:2,min:10,max:12},chest:{name:'Жим от груди в тренажёре',n:3,min:10,max:12},fly:{name:'Сведение рук на грудь',n:2,min:12,max:12},shoulder:{name:'Жим плечами в тренажёре',n:2,min:10,max:12},legpress:{name:'Жим ногами',n:2,min:10,max:12},curl:{name:'Сгибание ног в тренажёре',n:2,min:12,max:12},abduction:{name:'Разведение ног в тренажёре',n:2,min:15,max:15},abs:{name:'Пресс в тренажёре',n:2,min:12,max:15},hyper:{name:'Гиперэкстензия',n:2,min:12,max:12}};
const PROGRAMS={A:{name:'Спина и подтягивания',short:'Спина',subtitle:'Тяги · контроль · сила',ex:['gravitron','pulldown','row']},B:{name:'Грудь и плечи',short:'Грудь и плечи',subtitle:'Жимы · грудь · плечи',ex:['chest','fly','shoulder']},C:{name:'Ноги и ягодицы',short:'Ноги и ягодицы',subtitle:'Ноги · устойчивость · ягодицы',ex:['legpress','curl','abduction']}};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);
function localDay(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayLabel(day,full=false){return new Date(day+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:full?'long':'short',...(full?{year:'numeric'}:{})})}
const today=()=>localDay();
const uid=()=>globalThis.crypto?.randomUUID?.()||'s'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const DEFAULT_EX=JSON.parse(JSON.stringify(EX)),DEFAULT_PROGRAMS=JSON.parse(JSON.stringify(PROGRAMS));
function defaultPlan(){return {order:['A','B','C'],before:['run:before'],after:['abs','hyper','run:after'],runMinutes:{before:10,after:10},programs:JSON.parse(JSON.stringify(DEFAULT_PROGRAMS)),exercises:JSON.parse(JSON.stringify(DEFAULT_EX))}}
function fresh(){return {version:1,sessions:[],active:null,settings:{rest:90},plan:defaultPlan(),lastExport:null}}
function validId(id){return typeof id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(id)&&!['__proto__','prototype','constructor'].includes(id)}
function validName(v){return typeof v==='string'&&v.trim().length>0&&v.length<=100}
function validDefinition(v){return v&&validName(v.name)&&Number.isInteger(v.n)&&v.n>=1&&v.n<=20&&Number.isInteger(v.min)&&v.min>=1&&v.min<=200&&Number.isInteger(v.max)&&v.max>=v.min&&v.max<=200&&(v.help===undefined||typeof v.help==='boolean')}
function validatePlan(raw){
 if(!raw||!Array.isArray(raw.order)||!Array.isArray(raw.before)||!Array.isArray(raw.after)||!raw.programs||typeof raw.programs!=='object'||Array.isArray(raw.programs)||!raw.exercises||typeof raw.exercises!=='object'||Array.isArray(raw.exercises))throw Error('Некорректная программа.');
 if(Object.keys(raw.programs).length>500||Object.keys(raw.exercises).length>2000||raw.order.length>50)throw Error('Слишком много элементов программы.');
 const programs=Object.create(null),exercises=Object.create(null);
 for(const [id,e] of Object.entries(raw.exercises)){if(!validId(id)||!validDefinition(e)||(e.sourceId!==undefined&&!validId(e.sourceId)))throw Error('Некорректное упражнение в программе.');exercises[id]={name:e.name.trim(),n:e.n,min:e.min,max:e.max,help:!!e.help};if(e.sourceId!==undefined)exercises[id].sourceId=e.sourceId}
 for(const [id,d] of Object.entries(raw.programs)){if(!validId(id)||!d||!validName(d.name)||!Array.isArray(d.ex)||d.ex.length>20||d.ex.some(x=>!validId(x)||!Object.hasOwn(exercises,x))||new Set(d.ex).size!==d.ex.length)throw Error('Некорректный день программы.');programs[id]={name:d.name.trim(),ex:[...d.ex]}}
 const special=new Set(['run:before','run:after']);
 for(const [key,run] of [['before','run:before'],['after','run:after']]){const a=raw[key];if(a.length>20||a.some(id=>typeof id!=='string'||(id!==run&&(!validId(id)||!Object.hasOwn(exercises,id))))||new Set(a).size!==a.length)throw Error('Некорректный общий блок.');}
 if(raw.order.some(id=>!validId(id)||!Object.hasOwn(programs,id))||new Set(raw.order).size!==raw.order.length)throw Error('Некорректный порядок дней.');
 for(const id of raw.order){const all=[...raw.before,...programs[id].ex,...raw.after].filter(x=>!special.has(x));if(new Set(all).size!==all.length||all.length>50)throw Error('Одно упражнение нельзя добавить в тренировку дважды. Убери повтор из общего блока или дня.');}
 const runMinutes={};for(const part of ['before','after']){const n=raw.runMinutes?.[part]??10;if(!Number.isInteger(n)||n<1||n>600)throw Error('Время дорожки — от 1 до 600 минут.');runMinutes[part]=n}
 return {order:[...raw.order],before:[...raw.before],after:[...raw.after],runMinutes,programs,exercises};
}
function installPlan(plan){for(const key of Object.keys(EX))delete EX[key];Object.assign(EX,plan.exercises);for(const key of Object.keys(PROGRAMS))delete PROGRAMS[key];Object.assign(PROGRAMS,plan.programs)}
function dayCode(id,plan=store.plan){let n=plan.order.indexOf(id)+1;if(!n)return ['A','B','C'].includes(id)?id:'•';let code='';while(n){n--;code=String.fromCharCode(65+n%26)+code;n=Math.floor(n/26)}return code}
function getExercise(e){return e.definition||EX[e.id]}
function isGravitron(id){const seen=new Set();while(id&&!seen.has(id)){if(id==='gravitron')return true;seen.add(id);id=EX[id]?.sourceId}return false}
function getProgramName(s){return s.programName||PROGRAMS[s.program]?.name||'Тренировка'}

let persisted=null,blocked=false,store=fresh(),tab='programs',period='30',exerciseChoice='gravitron',metricChoice='weight',confirmAction=null,toastTimeout;
const validDay=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())&&localDay(new Date(s+'T12:00:00'))===s;
const finite=(n,min,max)=>typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max;
function validate(data){
 if(!data||data.version!==1||!Array.isArray(data.sessions)||data.sessions.length>50000)throw Error('Неизвестный формат файла.');
 const settings=data.settings;
 if(!settings||![90,120].includes(settings.rest))throw Error('Некорректные настройки.');
 const plan=data.plan===undefined?defaultPlan():validatePlan(data.plan);
 const defs=plan.exercises, programs=plan.programs;
 const ids=new Set();
 function session(s,active){
  if(!s||typeof s.id!=='string'||s.id.length>100||!s.id||ids.has(s.id)||!validId(s.program)||!Object.hasOwn(programs,s.program)||!validDay(s.date)||!finite(s.startedAt,0,1e14)||(!active&&!finite(s.finishedAt,s.startedAt,1e14)))throw Error('Некорректная запись тренировки.');
  ids.add(s.id);
  for(const k of ['bodyWeight','pullups'])if(s[k]!==null&&!finite(s[k],k==='bodyWeight'?1:0,k==='bodyWeight'?500:100))throw Error('Некорректный вес или повторения.');
  if(s.pullups!==null&&!Number.isInteger(s.pullups))throw Error('Некорректные подтягивания.');
  if(!Array.isArray(s.exercises)||s.exercises.length>50)throw Error('Некорректные упражнения.');
  const exerciseIds=new Set();
  const exercises=s.exercises.map(e=>{
   if(!e||!validId(e.id)||!Object.hasOwn(defs,e.id)||exerciseIds.has(e.id)||typeof e.skipped!=='boolean'||!Array.isArray(e.sets)||e.sets.length<1||e.sets.length>20||(e.definition!==undefined&&(!validDefinition(e.definition)||e.definition.n!==e.sets.length)))throw Error('Некорректные подходы.');
   exerciseIds.add(e.id);
   const out={id:e.id,skipped:e.skipped,sets:e.sets.map(x=>{
    if(!x||typeof x.done!=='boolean'||(x.weight!==null&&!finite(x.weight,0,2000))||(x.reps!==null&&(!finite(x.reps,1,200)||!Number.isInteger(x.reps)))||(x.done&&(x.weight===null||x.reps===null)))throw Error('Некорректные значения подхода.');
    return {weight:x.weight,reps:x.reps,done:x.done};
   })};if(e.definition)out.definition={name:e.definition.name.trim(),n:e.definition.n,min:e.definition.min,max:e.definition.max,help:!!e.definition.help};return out;
  });
  for(const k of ['before','after','warmup'])if(typeof s[k]!=='boolean')throw Error('Некорректная отметка.');
  let running;
  if(s.running!==undefined){
   if(!s.running||typeof s.running!=='object')throw Error('Некорректные данные бега.');
   running={};for(const part of ['before','after']){const v=s.running[part];if(!v||(v.speed!==null&&!finite(v.speed,0.1,40))||(v.minutes!==null&&!finite(v.minutes,0.1,600)))throw Error('Некорректные данные бега.');running[part]={speed:v.speed,minutes:v.minutes};}
  }
  const result={id:s.id,program:s.program,date:s.date,startedAt:s.startedAt,finishedAt:active?null:s.finishedAt,bodyWeight:s.bodyWeight,pullups:s.pullups,before:s.before,after:s.after,warmup:s.warmup,restUntil:active&&finite(s.restUntil,0,1e14)?s.restUntil:null,exercises};
  if(running)result.running=running;
  if(s.programName!==undefined){if(!validName(s.programName))throw Error('Некорректное название дня.');result.programName=s.programName.trim()}
  if(s.programLabel!==undefined){if(typeof s.programLabel!=='string'||s.programLabel.length>10)throw Error('Некорректное обозначение дня.');result.programLabel=s.programLabel}
  if(s.layout!==undefined){if(!Array.isArray(s.layout)||s.layout.length>52||s.layout.some(x=>x!=='run:before'&&x!=='run:after'&&!exerciseIds.has(x))||new Set(s.layout).size!==s.layout.length||s.layout.filter(x=>exerciseIds.has(x)).length!==exerciseIds.size)throw Error('Некорректный состав тренировки.');result.layout=[...s.layout]}
  return result;
 }
 const sessions=data.sessions.map(s=>session(s,false)),active=data.active?session(data.active,true):null;
 // Remove only the old automatic pause in a draft; completed history stays intact.
 if(settings.hyper===false&&active){const hyper=active.exercises.find(e=>e.id==='hyper');if(hyper)hyper.skipped=false;}
 return {version:1,sessions,active,settings:{rest:settings.rest},plan,lastExport:finite(data.lastExport,0,1e14)?data.lastExport:null};
}
function storageError(message){$('#storage-error').hidden=false;$('#storage-error').textContent=message}
function demoData(){
 const data=fresh(),programs=['A','B','C'];
 for(let i=0;i<90;i++){
  const date=new Date();date.setHours(12,0,0,0);date.setDate(date.getDate()-(178-i*2));const day=localDay(date),program=programs[i%3],start=date.getTime()+7*3600000,ids=[...data.plan.programs[program].ex,'abs','hyper'];
  const exercises=ids.map(id=>{const e=data.plan.exercises[id],base={gravitron:58,pulldown:25,row:25,chest:20,fly:15,shoulder:15,legpress:60,curl:20,abduction:25,abs:15,hyper:0}[id],weight=id==='gravitron'?Math.max(5,base-Math.floor(i/8)*2.5):base+Math.floor(i/12)*2.5;return {id,skipped:false,definition:{...e},sets:Array.from({length:e.n},(_,j)=>({weight,reps:Math.min(e.max,e.min+(i+j)%3),done:true}))}});
  data.sessions.push({id:'demo-'+i,program,date:day,startedAt:start,finishedAt:start+3600000,bodyWeight:Math.round((83-i*.045+Math.sin(i/4)*.4)*10)/10,pullups:null,before:true,after:true,warmup:true,restUntil:null,exercises,running:{before:{speed:Math.round((7+i*.01)*10)/10,minutes:10},after:{speed:Math.round((6.8+i*.01)*10)/10,minutes:10}},layout:['run:before',...ids,'run:after'],programName:data.plan.programs[program].name,programLabel:program});
 }return data;
}
try{persisted=localStorage.getItem(KEY);if(persisted)store=validate(JSON.parse(persisted));else if(DEMO){store=validate(demoData());persisted=JSON.stringify(store);localStorage.setItem(KEY,persisted)}if(DEMO)$('#demo-banner').hidden=false;}catch(e){blocked=true;storageError('Не удалось прочитать дневник. Запись приостановлена. Открой настройки и сохрани экспорт перед восстановлением.');}
function save(){
 if(blocked){toast('Запись приостановлена. Проверь настройки данных.');return false}
 try{
  const latest=localStorage.getItem(KEY);
  if(latest!==persisted){store=latest?validate(JSON.parse(latest)):fresh();persisted=latest;render();toast('Данные изменены в другой вкладке. Повтори действие.');return false}
  const encoded=JSON.stringify(store);localStorage.setItem(KEY,encoded);persisted=encoded;$('#storage-error').hidden=true;return true;
 }catch(e){storageError('Не удалось сохранить изменения в браузере. Не закрывай страницу: сделай экспорт в настройках.');return false}
}
function toast(message){clearTimeout(toastTimeout);$('#toast').textContent=message;$('#toast').classList.add('visible');toastTimeout=setTimeout(()=>$('#toast').classList.remove('visible'),3500)}
function ask(title,copy,label,action){$('#confirm-title').textContent=title;$('#confirm-copy').textContent=copy;$('#confirm-ok').textContent=label;confirmAction=action;$('#confirm').showModal()}
function doneSets(s){return s.exercises.flatMap(e=>e.skipped?[]:e.sets.filter(x=>x.done))}
function lastSession(){return [...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finishedAt-a.finishedAt)[0]}
function nextProgram(){const order=store.plan.order,last=lastSession(),index=last?order.indexOf(last.program):-1;return order.length?order[(index+1)%order.length]:null}
function rangeText(e){return e.min===e.max?e.min:e.min+'–'+e.max}
function previousSets(id){const sessions=[...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finishedAt-a.finishedAt);for(const s of sessions){const e=s.exercises.find(e=>e.id===id&&!e.skipped&&e.sets.some(x=>x.done));if(e)return e.sets.filter(x=>x.done)}return []}
function render(){
 installPlan(store.plan);
 const settingsButton=$('#settings-open');
 $('#brand-icon').innerHTML=icon('dumbbell');settingsButton.innerHTML=icon('settings');
 const labels={programs:store.active?'Тренировка':'Программы',analytics:'Аналитика'};
 document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');b.innerHTML=icon(b.dataset.tab==='programs'&&store.active?'workout':b.dataset.tab)+labels[b.dataset.tab]+(b.dataset.tab==='programs'&&store.active?'<i class="live-dot" aria-label="Есть текущая тренировка"></i>':'')});
 $('#app').innerHTML=tab==='programs'?(store.active?renderWorkout():renderPrograms()):renderAnalytics();
 let pageTools=$('#app .page-title .page-tools');if(!pageTools){pageTools=document.createElement('div');pageTools.className='page-tools';$('#app .page-title').append(pageTools)}
 pageTools.append(settingsButton);updateTimer();
}
function switchTab(next){tab=next;render();window.scrollTo({top:0,behavior:'instant'})}
function routineCard(part){
 const items=store.plan[part];if(!items.length)return '';
 const title=part==='before'?'В начале тренировки':'В конце тренировки';
 return `<article class="panel program routine-card"><div class="program-top">${icon(part==='before'?'workout':'finish').replace('class="icon"','class="icon routine-icon"')}<div class="program-heading"><h2>${title}</h2></div></div><ul class="exercise-preview">${items.map(id=>id.startsWith('run:')?`<li><span>Беговая дорожка</span><small>${store.plan.runMinutes[part]} мин</small></li>`:`<li><span>${esc(EX[id].name)}</span><small>${EX[id].n} × ${rangeText(EX[id])}</small></li>`).join('')}</ul></article>`;
}
function renderPrograms(){
 const last=lastSession(),next=nextProgram();
 return `<div class="page-title programs-heading"><div><h1>Твоя программа</h1></div><div class="page-tools"><span class="pill">${dayLabel(today())}</span></div></div>
 <div class="program-grid">${store.plan.order.map(id=>{const p=PROGRAMS[id];
 return `<article class="panel program ${last?.program===id?'last':''}" data-p="${id}"><div class="program-top"><div class="letter">${dayCode(id)}</div><div class="program-heading"><h2>${esc(p.name)}</h2>${last?.program===id?'<span class="pill mint">Прошлая</span>':id===next?'<span class="pill accent">Следующая</span>':''}</div></div><ul class="exercise-preview">${p.ex.map(k=>`<li><span>${esc(EX[k].name)}</span><small>${EX[k].n} × ${rangeText(EX[k])}</small></li>`).join('')}</ul><div class="program-bottom"><button data-start="${id}">Начать ${dayCode(id)} <span aria-hidden="true">→</span></button></div></article>`;
 }).join('')}</div>
 ${routineCard('before')}${routineCard('after')}<div class="plan-edit"><button data-action="edit-plan">Настроить программу</button></div>
`;
}
let planDraft=null,planTab='days',planOpen=new Set(),planScreen=null,planDrag=null;
function clone(v){return JSON.parse(JSON.stringify(v))}
function freezeLegacy(session,plan){
 if(!session)return;
 if(!session.programName)session.programName=plan.programs[session.program]?.name||'Тренировка';
 if(!session.programLabel)session.programLabel=dayCode(session.program,plan);
 for(const e of session.exercises)if(!e.definition){const def=plan.exercises[e.id];e.definition={...def,n:e.sets.length,help:!!def.help}}

$('#plan-editor').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.selectEx){const picker=b.closest('.plan-picker');picker.querySelector('[data-existing]').value=b.dataset.selectEx;picker.querySelector('.plan-picker-label').textContent=b.textContent;picker.querySelectorAll('[data-select-ex]').forEach(option=>option.setAttribute('aria-pressed',String(option===b)));picker.open=false;picker.querySelector('summary').focus();return}if(b.dataset.planTab){planTab=b.dataset.planTab;planScreen=null;renderPlanEditor();return}if(b.hasAttribute('data-close-editor')){$('#plan-editor').close();return}if(b.dataset.plan)handlePlanAction(b)});
$('#plan-editor').addEventListener('keydown',event=>{if(event.key==='Escape'){const picker=event.target.closest('.plan-picker');if(picker&&picker.open){event.preventDefault();event.stopPropagation();picker.open=false;picker.querySelector('summary').focus()}}});
function reorderPlan(kind,section,from,to){const list=kind==='day'?planDraft.order:planItems(section);if(!list||from===to||from<0||to<0||from>=list.length||to>=list.length)return;list.splice(to,0,list.splice(from,1)[0]);renderPlanEditor()}
function updatePlanDrag(x,y){
 const d=planDrag;if(!d)return;d.x=x;d.y=y;d.ghost.style.left=(x-d.offsetX)+'px';d.ghost.style.top=(y-d.offsetY)+'px';
 const rows=[...$('#plan-editor').querySelectorAll('[data-drag-row]')].filter(row=>row.dataset.dragRow===d.kind&&(d.kind==='day'||row.dataset.section===d.section));
 rows.forEach(row=>row.classList.remove('drop-before','drop-after'));if(!rows.length)return;
 let boundary=rows.length;for(let i=0;i<rows.length;i++){const r=rows[i].getBoundingClientRect();if(y<r.top+r.height/2){boundary=i;break}}
 const marker=boundary===rows.length?rows.at(-1):rows[boundary];marker.classList.add(boundary===rows.length?'drop-after':'drop-before');
 d.to=Math.max(0,Math.min(rows.length-1,boundary-(boundary>d.from?1:0)));
}
function scrollPlanDrag(){if(!planDrag)return;const d=planDrag,box=$('#plan-editor .plan-content'),r=box.getBoundingClientRect();let delta=0;if(d.y<r.top+45)delta=-Math.min(12,(r.top+45-d.y)/3);else if(d.y>r.bottom-45)delta=Math.min(12,(d.y-(r.bottom-45))/3);if(delta){const previous=box.scrollTop;box.scrollTop+=delta;if(box.scrollTop!==previous)updatePlanDrag(d.x,d.y)}d.frame=requestAnimationFrame(scrollPlanDrag)}
$('#plan-editor').addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-drag]');if(!handle||event.button!==0)return;event.preventDefault();const row=handle.closest('[data-drag-row]'),rect=row.getBoundingClientRect(),ghost=row.cloneNode(true);ghost.classList.add('plan-drag-ghost');ghost.setAttribute('aria-hidden','true');ghost.style.width=rect.width+'px';$('#plan-editor').append(ghost);planDrag={pointer:event.pointerId,kind:handle.dataset.drag,section:handle.dataset.section||'',from:Number(handle.dataset.index),to:Number(handle.dataset.index),row,ghost,offsetX:event.clientX-rect.left,offsetY:event.clientY-rect.top};handle.setPointerCapture(event.pointerId);row.classList.add('dragging');updatePlanDrag(event.clientX,event.clientY);planDrag.frame=requestAnimationFrame(scrollPlanDrag)});
$('#plan-editor').addEventListener('pointermove',event=>{if(planDrag&&event.pointerId===planDrag.pointer)updatePlanDrag(event.clientX,event.clientY)});
function finishPlanDrag(event,cancel=false){if(!planDrag||event.pointerId!==planDrag.pointer)return;const d=planDrag;planDrag=null;cancelAnimationFrame(d.frame);d.ghost.remove();d.row.classList.remove('dragging');document.querySelectorAll('#plan-editor .drop-before,#plan-editor .drop-after').forEach(row=>row.classList.remove('drop-before','drop-after'));if(!cancel)reorderPlan(d.kind,d.section,d.from,d.to)}
$('#plan-editor').addEventListener('pointerup',event=>finishPlanDrag(event));$('#plan-editor').addEventListener('pointercancel',event=>finishPlanDrag(event,true));
$('#plan-editor').addEventListener('keydown',event=>{const handle=event.target.closest('[data-drag]');if(handle&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const from=Number(handle.dataset.index),to=from+(event.key==='ArrowUp'?-1:1),kind=handle.dataset.drag,section=handle.dataset.section||'';reorderPlan(kind,section,from,to);const list=kind==='day'?planDraft.order:planItems(section);const idx=Math.max(0,Math.min(to,list.length-1));$('#plan-editor').querySelector(`[data-drag="${kind}"][data-index="${idx}"]`)?.focus()}});
$('#record').addEventListener('click',event=>{if(event.target.id==='save-record')saveRecord();if(event.target.id==='delete-record'){const id=$('#record').dataset.id;ask('Удалить эту тренировку?','Она исчезнет из истории и графиков. Другие тренировки этого дня сохранятся.','Удалить',()=>{store.sessions=store.sessions.filter(s=>s.id!==id);if(save()){$('#record').close();render();toast('Тренировка удалена.')}})}});
// Place the caret at the end on entry while allowing a later tap to reposition it.
const firstTextTap=new WeakSet();
function textInput(el){return el instanceof HTMLInputElement&&el.type==='text'}
function caretToEnd(el){if(document.activeElement===el&&el.value.length)el.setSelectionRange(el.value.length,el.value.length)}
document.addEventListener('pointerdown',event=>{const el=event.target;if(textInput(el)&&document.activeElement!==el)firstTextTap.add(el)});
document.addEventListener('focusin',event=>{const el=event.target;if(textInput(el))requestAnimationFrame(()=>caretToEnd(el))});
document.addEventListener('click',event=>{const el=event.target;if(textInput(el)&&firstTextTap.has(el)){firstTextTap.delete(el);caretToEnd(el)}});
window.addEventListener('storage',event=>{if(event.key!==KEY&&event.key!==null)return;try{const raw=localStorage.getItem(KEY);store=raw?validate(JSON.parse(raw)):fresh();persisted=raw;blocked=false;document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();toast('История обновлена из другой вкладки.')}catch(e){blocked=true;storageError('В другой вкладке появились нечитаемые данные. Сделай экспорт и восстанови дневник.')}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(tab==='analytics'&&!document.querySelector('dialog[open]'))render()},150)});
let knownDay=today();function checkDay(){if(knownDay!==today()){knownDay=today();if(!store.active&&!document.querySelector('dialog[open]'))render()}}
setInterval(()=>{updateTimer();checkDay()},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateTimer();checkDay()}});
render();
</script>
